name: release-epubs

# Tag a version (e.g. `git tag v2026.07.1 && git push --tags`) and this builds
# the five per-language EPUB editions plus a PDF twin of each, AND the print-ready
# LaTeX interior ("Print Edition - Generic.pdf"), and publishes them as release
# assets. Stable download URLs (always the newest release):
#   https://github.com/tghastings/open-swe-book/releases/latest/download/swebook-python.epub
#   https://github.com/tghastings/open-swe-book/releases/latest/download/swebook-python.pdf
#   https://github.com/tghastings/open-swe-book/releases/latest/download/Print.Edition.-.Generic.pdf
#
# The print edition is set in Amazon Endure. The .otf files are NOT in the repo
# (licensing); the workflow decodes them from the ENDURE_FONTS_B64 repo secret.
# Create it once from the local font dir:
#   tar czC latex/fonts AmazonEndure-Book.otf AmazonEndure-SemiBold.otf \
#     AmazonEndure-BookItalic.otf AmazonEndure-SemiBoldItalic.otf \
#     | base64 -w0 | gh secret set ENDURE_FONTS_B64
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook + mdbook-mermaid
        run: |
          MDBOOK_VERSION="0.4.40"
          MERMAID_VERSION="0.14.0"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --directory=/usr/local/bin
          curl -sSL "https://github.com/badboy/mdbook-mermaid/releases/download/v${MERMAID_VERSION}/mdbook-mermaid-v${MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --directory=/usr/local/bin

      - name: Install pandoc (pinned — apt's 3.1 emits MathML that fails epubcheck)
        run: |
          curl -sL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/3.10/pandoc-3.10-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      - name: Build the five EPUB editions and their PDF twins
        env:
          EPUB_OUT: ${{ github.workspace }}/dist
          CHROME_FLAGS: --no-sandbox
          SWEBOOK_VERSION: ${{ github.ref_name }}
        run: bash tools/build-epubs.sh

      - name: Validate every EPUB with epubcheck
        run: |
          curl -sL -o /tmp/epubcheck.zip \
            "https://github.com/w3c/epubcheck/releases/download/v5.1.0/epubcheck-5.1.0.zip"
          unzip -q /tmp/epubcheck.zip -d /tmp
          for f in dist/*.epub; do
            echo "== $f"
            java -jar /tmp/epubcheck-5.1.0/epubcheck.jar "$f"
          done

      - name: Build the print interior (LaTeX / xelatex, Amazon Endure)
        env:
          ENDURE_FONTS_B64: ${{ secrets.ENDURE_FONTS_B64 }}
          CHROME_FLAGS: --no-sandbox
          LATEX_NATIVE: "1"
        run: |
          if [ -z "$ENDURE_FONTS_B64" ]; then
            echo "::error::ENDURE_FONTS_B64 secret is not set — cannot build the Endure print edition."
            echo "::error::Create it with: tar czC latex/fonts AmazonEndure-Book.otf AmazonEndure-SemiBold.otf AmazonEndure-BookItalic.otf AmazonEndure-SemiBoldItalic.otf | base64 -w0 | gh secret set ENDURE_FONTS_B64"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-latex-recommended \
            texlive-fonts-recommended texlive-plain-generic texlive-bibtex-extra biber \
            librsvg2-bin fontconfig lmodern imagemagick
          mkdir -p latex/fonts
          printf '%s' "$ENDURE_FONTS_B64" | base64 -d | tar xzC latex/fonts
          echo "fonts:"; ls latex/fonts/*.otf
          bash latex/book-build.sh   # exits non-zero if the PDF is not produced
          echo "print interior built: $(du -h latex/swebook-interior.pdf | cut -f1)"
          mkdir -p dist
          cp latex/swebook-interior.pdf "dist/Print Edition - Generic.pdf"

      - name: Publish as release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Software Engineering: Standing on the Shoulders of Giants $GITHUB_REF_NAME" \
            --notes "EPUB and PDF editions of [swebook.org](https://www.swebook.org), one per code-example language (prose is identical across editions), plus **Print Edition - Generic.pdf**: the print-ready 7x10 interior (pseudocode edition) set in Amazon Endure." \
            --verify-tag dist/*.epub dist/*.pdf \
          || gh release upload "$GITHUB_REF_NAME" dist/*.epub dist/*.pdf --clobber
