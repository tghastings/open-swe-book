name: build-and-deploy

on:
  push:
    # Tags only — the published site is a tagged deliverable, exactly like the
    # EPUB / PDF / cover release assets. Pushing to main never deploys, so there is
    # no branch build that can win the Pages concurrency race and deploy a stale
    # version (the "one tag behind" bug). v1.0b2 or a bare 1.0b2 both match.
    tags: ["v*", "[0-9]*"]

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages build/deploy at a time. Cancelling in-progress runs avoids
# leaving two "github-pages" artifacts behind (the cause of the
# "Multiple artifacts named github-pages" deploy error).
concurrency:
  group: pages   # serialize tag builds so two never race to deploy
  cancel-in-progress: true

jobs:
  # Build once, upload exactly one Pages artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the version into the sidebar and README
        run: |
          # Only tags trigger this workflow, so the pushed tag IS the version to
          # publish: v1.0b3 -> 1.0b3. Authoritative and race-free — no branch build
          # exists to deploy a stale version, and no git describe (whose same-commit
          # tag ambiguity once shipped 1.0b2 for a 1.0b3 tag).
          V="${GITHUB_REF_NAME#v}"
          V="${V:-1.0b1}"
          echo "publishing version: $V"
          sed -i -E "s/const VERSION = \"[^\"]*\"/const VERSION = \"${V}\"/" version.js
          sed -i -E "s/\*First Edition, [^*]*\*/*First Edition, ${V}.*/" README.md

      # Gate the build on footnote-numbering hygiene: every [^N] defined and used,
      # numbers in first-use order per file. Mechanical repairs: tools/check-footnotes.py --fix
      - name: Validate footnote numbering
        run: python3 tools/check-footnotes.py

      - name: Install mdBook + mdbook-mermaid
        run: |
          MDBOOK_VERSION="0.4.40"
          MERMAID_VERSION="0.14.0"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --directory=/usr/local/bin
          curl -sSL "https://github.com/badboy/mdbook-mermaid/releases/download/v${MERMAID_VERSION}/mdbook-mermaid-v${MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --directory=/usr/local/bin

      - name: Build the book
        run: mdbook build

      - name: Check internal Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './**/*.md'
          fail: false

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book-output

  # Deploy the single artifact (tags only).
  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
